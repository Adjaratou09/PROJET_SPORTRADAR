


  <div class="login-wrapper d-flex">
  
  <!-- Colonne image avec texte -->
  <div class="image-side d-none d-md-block">
    <div class="overlay-text">
      
      <h1>Sport Radar-Bouger à votre rythme</h1>
      <p>Fitness et bien-être au quotidien</p>
    </div>
  </div>

  <!-- Colonne formulaire -->
  <div class="form-side">
    <div class="login-container">
      <div class="text-center mb-3">
        <h1 class="mt-2" style="color: #5f5143; ">Bienvenue</h1>
        <p class="text-muted" >Ton espace bien-être commence ici</p>
        <img src="assets/fondblanc.png" alt="Logo" width="90">
        
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
        <div class="mb-3">
          <label>Mot de passe</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <button type="submit" (click)="login()" class="btn btn-success w-100" style="  color: #0e0d0d; background-color: #dbfeb8">Connecte toi</button>

        <button type="button" class="btn btn-outline-dark w-100 mt-2" >
          <img src="assets/google.png" width="30" class="me-2"> Se connecter avec Google
        </button>

        <p class="text-center mt-3"> 
         Pas encore de compte ? <a [routerLink]="'/inscription'" class="btn btn-link p-0 m-0 align-baseline">Inscris-toi</a>
         </p>


        <div *ngIf="errorMessage" class="text-danger text-center">{{ errorMessage }}</div>
      </form>
    </div>
  </div>
</div>
